services:
  faculty-portal:
    image: production_faculty
    container_name: faculty-portal
    hostname: faculty-portal
    restart: always
    env_file:
      - .env
    healthcheck:
      # hit an API path that exists in your app
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1" ]
      interval: 30s
      timeout: 10s  
      retries: 5
      start_period: 30s
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.faculty-portal.rule=Host(`faculty.periyaruniversity.ac.in`)
      - traefik.http.routers.faculty-portal.entrypoints=websecure
      - traefik.http.routers.faculty-portal.tls=true
      - traefik.http.routers.faculty-portal.tls.certresolver=myresolver
      - traefik.http.routers.faculty-portal.middlewares=faculty-portal-ratelimit@docker,faculty-portal-cors@docker
      - traefik.http.services.faculty-portal.loadbalancer.server.port=3000
      - traefik.http.middlewares.faculty-portal-ratelimit.ratelimit.average=30
      - traefik.http.middlewares.faculty-portal-ratelimit.ratelimit.burst=120
      - traefik.http.middlewares.faculty-portal-ratelimit.ratelimit.period=3s
      - traefik.http.middlewares.faculty-portal-cors.headers.accessControlAllowOriginList=*
      - traefik.http.middlewares.faculty-portal-cors.headers.accessControlAllowMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
      - traefik.http.middlewares.faculty-portal-cors.headers.accessControlAllowHeaders=*
      - traefik.http.middlewares.faculty-portal-cors.headers.addVaryHeader=true

    volumes:
      - faculty_uploads:/home/periyaruniversity/Faculty-portal/uploads
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '1.0'
          memory: 256M
volumes:
  faculty_uploads:
    driver: local

networks:
  edge:
    external: true
    name: edge
  data:
    external: true
    name: data
